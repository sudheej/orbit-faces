[package]
name = "orbital-face-host"
version = "0.1.0"
edition = "2021"
default-run = "orbital-face-host"
description = "Minimal Windows-first desktop companion face host prototype."
license = "MIT"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
cpal = "0.18"
font8x8 = "0.3"
hound = "3.5"
mlua = { version = "0.11", features = ["lua54", "vendored", "serde", "error-send"] }
sdl3 = { version = "0.18", features = ["build-from-source"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.20"
wayland-client = "0.31"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
