[package]
name = "orbital-face-host"
version = "0.1.0"
edition = "2021"
description = "Minimal Windows-first desktop companion face host prototype."
license = "MIT"

[dependencies]
anyhow = "1"
mlua = { version = "0.11", features = ["lua54", "vendored", "serde", "error-send"] }
sdl3 = { version = "0.18", features = ["build-from-source"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
